plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = project.mod_version
group = 'dev.royalespells'
base { archivesName = 'royale-spells-neoforge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url='https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
neoForge {
    version = '21.1.249'
    runs {
        client { client(); gameDirectory = project.file('run-client') }
        server { server(); gameDirectory = project.file('run-server'); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'royalespells'
            systemProperty 'royalespells.gametestReport', 'gametest-results.xml'
        }
        compatGameTest {
            type='gameTestServer';gameDirectory=project.file('run-compat-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces','royalespells'
            systemProperty 'royalespells.gametestReport','gametest-results.xml'
        }
        spiritVisual {
            client();gameDirectory=project.file('run-spirit-visual')
            systemProperty 'royalespells.visualSmoke','true'
            systemProperty 'royalespells.spiritSmoke','true'
            jvmArgument '-Xmx4G'
            programArguments.addAll('--username','RoyaleSpiritQA','--width','1600','--height','1000')
        }
        compatVisual {
            client();gameDirectory=project.file('run-compat-visual')
            systemProperty 'royalespells.visualSmoke','true'
            systemProperty 'royalespells.ironSmoke','true'
            jvmArgument '-Xmx4G'
            programArguments.addAll('--username','RoyaleNeoQA','--width','1280','--height','800')
        }
        visualSmoke {
            client(); gameDirectory = project.file('run-visual')
            systemProperty 'royalespells.visualSmoke', 'true'
            jvmArgument '-Xmx3G'
            programArguments.addAll('--username', 'RoyaleNeoQA', '--width', '1280', '--height', '800')
        }
        showcase {
            client(); gameDirectory = project.file('run-showcase')
            systemProperty 'royalespells.visualSmoke', 'true'
            systemProperty 'royalespells.buildShowcase', 'true'
            jvmArgument '-Xmx3G'
            programArguments.addAll('--username', 'RoyaleNeoQA', '--width', '1600', '--height', '1000')
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { royalespells { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly('maven.modrinth:irons-spells-n-spellbooks:1.21.1-3.16.3') { transitive=false }
    compileOnly('maven.modrinth:geckolib:tPkJmim6') { transitive=false }
    if (project.hasProperty('compatModsDir')) {
        runtimeOnly fileTree(dir: project.property('compatModsDir'), include: '*.jar')
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }

// All opt-in graphical checks get their own first-run options and save directories.
for (taskName in ['runVisualSmoke','runShowcase','runCompatVisual','runSpiritVisual']) {
    tasks.named(taskName).configure {
        doFirst {
            def dirName=[runVisualSmoke:'run-visual',runShowcase:'run-showcase',runCompatVisual:'run-compat-visual',runSpiritVisual:'run-spirit-visual'][taskName]
            def options=file("${dirName}/options.txt")
            if(!options.exists()) {
                options.parentFile.mkdirs()
                options.text='lang:zh_cn\nrenderDistance:6\nsimulationDistance:5\nguiScale:2\nmaxFps:60\ntutorialStep:none\npauseOnLostFocus:false\nonboardAccessibility:false\n'
            }
        }
    }
}
