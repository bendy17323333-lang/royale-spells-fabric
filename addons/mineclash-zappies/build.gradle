plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.146' }
version=project.mod_version
group='dev.mineclash.zappies'
base { archivesName='mineclash-zappies-neoforge-1.21.1' }
java { toolchain.languageVersion=JavaLanguageVersion.of(21); withSourcesJar() }
repositories { mavenCentral(); maven { url='https://api.modrinth.com/maven' } }
neoForge {
    version='21.1.249'
    runs {
        client { client();gameDirectory=project.file('run-client') }
        gameTestServer {
            type='gameTestServer';gameDirectory=project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces','zappiesaddon'
            systemProperty 'zappiesaddon.gametestReport','gametest-results.xml'
        }
    }
    mods { zappiesaddon { sourceSet sourceSets.main } }
}
dependencies {
    // No private workspace dependency: the optional integration API is public.
    compileOnly('maven.modrinth:irons-spells-n-spellbooks:1.21.1-3.16.3') { transitive=false }
    if(project.hasProperty('compatModsDir'))runtimeOnly fileTree(dir:project.property('compatModsDir'),include:'*.jar')
    implementation files(findProperty('mineclashJar') ?: 'libs/mineclash-0.7.5-1.21.1.jar')
    implementation files(findProperty('geckolibJar') ?: 'libs/geckolib-neoforge-1.21.1-4.9.2.jar')
}
processResources {
    from('LICENSE','ASSETS.md')
    inputs.property 'version',project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand 'version':project.version }
}
tasks.withType(JavaCompile).configureEach { options.release=21;options.encoding='UTF-8' }
